    <rect x='160' y='10' height='20' width='50' rx='0' ry='0' class='rule'/>
    <text x='185' y='25' text-anchor='middle' class='rule'>Ws</text>
    <rect x='230' y='10' height='20' width='110' rx='0' ry='0' class='rule'/>
    <text x='285' y='25' text-anchor='middle' class='rule'>StringLiteral</text>
    <rect x='360' y='10' height='20' width='50' rx='0' ry='0' class='rule'/>
    <text x='385' y='25' text-anchor='middle' class='rule'>Ws</text>
